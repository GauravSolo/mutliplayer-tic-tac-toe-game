services:
  cockroachdb:
    image: cockroachdb/cockroach:latest
    command: start-single-node --insecure --store=attrs=ssd,path=/var/lib/cockroach/
    ports:
      - "26257:26257"
      - "8080:8080"
    volumes:
      - cockroach-data:/var/lib/cockroach/
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health?ready=1"]
      interval: 3s
      timeout: 3s
      retries: 5

  nakama:
    image: heroiclabs/nakama:3.38.0
    depends_on:
      cockroachdb:
        condition: service_healthy
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - |
        /nakama/nakama migrate up --database.address root@cockroachdb:26257
        exec /nakama/nakama \
          --name nakama \
          --database.address root@cockroachdb:26257 \
          --logger.level INFO \
          --runtime.js_entrypoint "index.js"
    ports:
      - "7350:7350"
      - "7351:7351"
    links:
      - cockroachdb
    volumes:
      - nakama-data:/nakama/data
      - ./backend:/nakama/data/modules

volumes:
  cockroach-data:
  nakama-data: