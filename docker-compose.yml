services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 3s
      timeout: 3s
      retries: 5

  nakama:
    image: heroiclabs/nakama:3.38.0
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - |
        /nakama/nakama migrate up --database.address postgres:localdb@postgres:5432/nakama
        exec /nakama/nakama \
          --name nakama \
          --database.address postgres:localdb@postgres:5432/nakama \
          --logger.level INFO \
          --runtime.js_entrypoint "index.js"
    ports:
      - "7350:7350"
      - "7351:7351"
      - "7352:7352"
    volumes:
      - nakama-data:/nakama/data
      - ./backend:/nakama/data/modules

volumes:
  postgres-data:
  nakama-data:
